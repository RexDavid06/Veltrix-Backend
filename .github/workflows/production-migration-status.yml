name: Temporary production migration status check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      # Production secrets are not supplied to dependency installation.
      - name: Install backend dependencies
        run: |
          set +x
          python -m pip install -r requirements.txt

      - name: Verify production target and show migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EXPECTED_DATABASE_HOST: ${{ secrets.PRODUCTION_DATABASE_HOST }}
          EXPECTED_DATABASE_NAME: ${{ secrets.PRODUCTION_DATABASE_NAME }}
          DEBUG: "0"
        run: |
          set +x
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import parse_qsl, unquote, urlsplit

          url = os.environ.get("DATABASE_URL", "")
          secret_key = os.environ.get("SECRET_KEY", "")
          expected_host_raw = os.environ.get("EXPECTED_DATABASE_HOST", "")
          expected_name = os.environ.get("EXPECTED_DATABASE_NAME", "")

          if (
              not url
              or not secret_key
              or secret_key == "dev-insecure-secret-change-me"
              or not expected_host_raw
              or expected_host_raw != expected_host_raw.strip()
              or not expected_name
              or expected_name != expected_name.strip()
          ):
              print("::error::Required database configuration is missing or invalid.")
              sys.exit(1)

          if any(ord(char) <= 32 or ord(char) == 127 for char in url):
              print("::error::Database URL contains whitespace or control characters.")
              sys.exit(1)

          if re.search(r"%(?![0-9A-Fa-f]{2})", url):
              print("::error::Database URL contains malformed encoding.")
              sys.exit(1)

          try:
              parsed = urlsplit(url)
              actual_host = (parsed.hostname or "").lower().rstrip(".")
              expected_host = expected_host_raw.lower().rstrip(".")
              username = parsed.username
              password = parsed.password
              port = parsed.port
              raw_path = parsed.path

              database_name = (
                  unquote(raw_path[1:], encoding="utf-8", errors="strict")
                  if raw_path.startswith("/")
                  else ""
              )
              decoded_username = unquote(
                  username or "", encoding="utf-8", errors="strict"
              )
              decoded_password = unquote(
                  password or "", encoding="utf-8", errors="strict"
              )
              query_items = parse_qsl(
                  parsed.query,
                  keep_blank_values=True,
                  strict_parsing=True,
                  encoding="utf-8",
                  errors="strict",
              )
          except Exception:
              print("::error::Database target could not be verified.")
              sys.exit(1)

          valid_database_component = (
              raw_path.startswith("/")
              and raw_path.count("/") == 1
              and bool(database_name)
              and "/" not in database_name
              and "\x00" not in database_name
              and not any(
                  ord(char) < 32 or ord(char) == 127
                  for char in database_name
              )
              and len(database_name.encode("utf-8")) <= 63
          )

          query = {}
          for key, value in query_items:
              if key != "sslmode" or key in query or not value:
                  print("::error::Database URL contains an unsupported connection option.")
                  sys.exit(1)
              query[key] = value

          sslmode = query.get("sslmode")
          if sslmode not in {"require", "verify-ca", "verify-full"}:
              print("::error::A supported explicit PostgreSQL SSL mode is required.")
              sys.exit(1)

          effective_port = 5432 if port is None else port

          if (
              parsed.scheme not in {"postgres", "postgresql"}
              or not actual_host
              or not expected_host
              or not username
              or not password
              or not decoded_username
              or not decoded_password
              or not 1 <= effective_port <= 65535
              or parsed.fragment
              or not valid_database_component
              or actual_host != expected_host
              or database_name != expected_name
          ):
              print("::error::Database target did not match the expected production identifier or required connection fields.")
              sys.exit(1)

          print("Production database target verified.")

          try:
              result = subprocess.run(
                  ["python", "manage.py", "showmigrations", "veltrix_app"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )
          except Exception:
              print("::error::Migration status command failed; details suppressed.")
              sys.exit(1)

          if result.returncode != 0:
              print("::error::Migration status command failed; details suppressed.")
              sys.exit(result.returncode)

          sensitive_values = (
              url,
              unquote(url, encoding="utf-8", errors="replace"),
              username,
              password,
              decoded_username,
              decoded_password,
              secret_key,
              expected_host_raw,
              expected_name,
          )
          if any(value and value in result.stdout for value in sensitive_values):
              print("::error::Migration status output contained sensitive data; output suppressed.")
              sys.exit(1)

          sys.stdout.write(result.stdout)
          PY
