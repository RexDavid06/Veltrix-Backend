name: Recover Django Admin (manual, confirmed)

# Manually dispatched only. Recovers the ONE existing active superuser by
# resetting its username, email, and password to values supplied through
# repository secrets. It never creates a user and never touches any other
# account. An incorrect confirmation phrase is rejected before the runner
# even checks out the repository, and the password is only ever read from
# the DJANGO_ADMIN_RECOVERY_PASSWORD secret - it is never a workflow input
# and is never printed.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET_EXISTING_ADMIN to authorize the recovery. Any other value aborts before any database access."
        required: true
        type: string

# The job only reads the repo; it never writes to it.
permissions:
  contents: read

# Never let two recovery runs race each other.
concurrency:
  group: recover-django-admin
  cancel-in-progress: false

jobs:
  recover-admin:
    name: Recover permanent superuser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One-shot management-command process; it never serves HTTP.
      # Production settings (DEBUG=0) are exercised exactly as they run on
      # Render. All credentials come exclusively from repository secrets and
      # are masked automatically in logs; no step prints a secret value.
      DEBUG: "0"
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_ADMIN_RECOVERY_PASSWORD: ${{ secrets.DJANGO_ADMIN_RECOVERY_PASSWORD }}
      DJANGO_ADMIN_RECOVERY_USERNAME: veltrixadmin
      DJANGO_ADMIN_RECOVERY_EMAIL: veltrix@gmail.com

    steps:
      # Reject an incorrect confirmation before anything else happens -
      # no checkout, no dependency install, and above all no database
      # contact. The value is passed via env (not string interpolation) so
      # a crafted input can never be executed by the shell.
      - name: Reject incorrect confirmation before any database access
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION_INPUT" != "RESET_EXISTING_ADMIN" ]; then
            echo "::error::Confirmation phrase did not match. Nothing was contacted or changed."
            exit 1
          fi
          echo "Confirmation phrase accepted."

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets are configured (values never printed)
        run: |
          missing=0
          for name in DATABASE_URL SECRET_KEY DJANGO_ADMIN_RECOVERY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set the missing secret(s) under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Verify DATABASE_URL points at PostgreSQL (nothing secret is printed)
        run: |
          python - <<'PY'
          import os
          import sys

          # Only the URL scheme is inspected; the URL itself embeds
          # credentials and is never printed.
          url = os.environ.get("DATABASE_URL", "")
          scheme = url.partition("://")[0].lower()
          if scheme not in ("postgres", "postgresql"):
              print("::error::DATABASE_URL must use the postgres:// or postgresql:// scheme.")
              sys.exit(1)
          print("DATABASE_URL scheme is PostgreSQL.")
          PY

      - name: Check database connectivity (read-only SELECT 1)
        run: |
          python - <<'PY'
          import os
          import sys

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "veltrix_project.settings")
          import django

          django.setup()
          from django.db import connection

          try:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT 1")
                  cursor.fetchone()
          except Exception:
              # Exception details may contain hosts or usernames; print only
              # a generic failure so no secret value reaches the logs.
              print("::error::Database connectivity check failed (read-only SELECT 1).")
              sys.exit(1)
          # Vendor only (e.g. "postgresql") - never hosts, users, or credentials.
          print(f"Database connectivity OK (vendor: {connection.vendor}).")
          PY

      - name: Verify migration state (this job never applies migrations)
        # Same guard as create-django-admin.yml: `migrate --check` exits
        # non-zero when unapplied migrations exist WITHOUT applying anything.
        # Production schema is owned by Render (the Dockerfile CMD runs
        # `python manage.py migrate --noinput` on every deploy); this job
        # never runs migrations or changes the schema.
        run: |
          if ! python manage.py migrate --check --noinput; then
            echo "::error::Unapplied migrations detected. Deploy through Render (its start command runs migrations); do not apply them from CI."
            exit 1
          fi
          echo "Migration state matches the repository."

      - name: Recover superuser (updates exactly one existing active admin)
        env:
          CONFIRMATION_INPUT: ${{ inputs.confirmation }}
        run: python manage.py recover_superuser --confirm "$CONFIRMATION_INPUT"
